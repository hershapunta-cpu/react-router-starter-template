<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f2f5f9; --surface:#ffffff; --ink:#14213a; --muted:#566178; --line:#d6dde8;
  --navy:#12284a; --gold:#b88a12; --goldbg:#f6ecc9; --teal:#1f7a6c; --bad:#b3402e; --chip:#e8edf5; --on-navy:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c182b; --surface:#13233d; --ink:#e8eef7; --muted:#9aa9c0; --line:#263858;
    --navy:#1d3a69; --gold:#e0b53c; --goldbg:#3a3014; --teal:#4cc2ae; --bad:#ff8a73; --chip:#1c2f50;
  }
}
:root[data-theme="dark"]{
  --bg:#0c182b; --surface:#13233d; --ink:#e8eef7; --muted:#9aa9c0; --line:#263858;
  --navy:#1d3a69; --gold:#e0b53c; --goldbg:#3a3014; --teal:#4cc2ae; --bad:#ff8a73; --chip:#1c2f50;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.45 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header.top{background:var(--navy);color:var(--on-navy);padding:10px 12px;border-bottom:4px solid var(--gold);display:flex;gap:8px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:6}
header.top h1{font-size:18px;flex:1;min-width:0}
header.top img{border-radius:9px;flex:none}
.ib{border:1px solid rgba(255,255,255,.4);background:transparent;color:var(--on-navy);border-radius:8px;min-width:40px;min-height:40px;font-weight:700;cursor:pointer;position:relative;padding:0 8px;font-size:15px}
.badge{position:absolute;top:-6px;right:-6px;background:var(--gold);color:#1a1405;border-radius:999px;font-size:11px;font-weight:700;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
main{max-width:720px;margin:0 auto;padding:14px 14px 28px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 140px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;min-height:42px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1405}
.btn.small{padding:5px 10px;min-height:34px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
input[type=text],input[type=number],input[type=date],input[type=email],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;min-height:42px}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.meta{color:var(--muted);font-size:13px}
.note{background:var(--goldbg);border-left:4px solid var(--gold);padding:9px 12px;border-radius:6px;font-size:13.5px;margin:10px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:22px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.out{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:14px}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;background:var(--chip);border:1px solid var(--line)}
.chip.bad{color:var(--bad);border-color:var(--bad);background:transparent}
.li{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.check{display:flex;gap:10px;align-items:center}
.check input{width:22px;height:22px;flex:none}
.tile{cursor:pointer}
.tile polygon{fill:var(--surface);stroke:var(--gold);stroke-width:3}
.tile:hover polygon,.tile:focus polygon{fill:var(--goldbg)}
.tile.locked{opacity:.6}
.tile.center polygon{fill:var(--navy);stroke:var(--gold)}
.tile text{fill:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif}
.tile.center text{fill:#fff}
.panel{position:fixed;right:10px;top:calc(62px + env(safe-area-inset-top,0px));width:min(340px,94vw);max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;z-index:30;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:40}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:6px 14px 22px}
details{border-bottom:1px solid var(--line);padding:8px 0}
summary{cursor:pointer;font-weight:600}
@media (min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>

<footer>Free tools from ReBoRn Marketing Solution Agency. Match. Fund. Grow. Glow.</footer>

<script>
var EDITION="client";
var KEY="reborn-tools-"+EDITION;
var ACCESS={home:"free",margin:"free",seo:"free",tasks:"free",help:"free",set:"free",fund:"client",mail:"client",funnel:"client",clients:"agency",prospects:"agency",gaps:"agency",ads:"agency",pipeline:"agency",backup:"agency"};
var RANK={free:0,client:1,agency:2};
function can(v){return RANK[EDITION]>=RANK[ACCESS[v]||"agency"]}
var S={view:"home",set:{biz:"",cur:"US$",wa:"12687342833",sound:false,theme:"auto"},
 margin:{price:150,cost:60,fixed:800,jobs:20,target:50},
 seo:{svc:"",biz:"",loc:"",aud:"",benefit:""},seoOut:null,
 tasks:[],notifyOn:false,
 fund:{purpose:"Equipment",amount:"Small (under 5,000)",stage:"Running 1 year or more",reg:"Yes"},fundOut:null,opps:[],
 contacts:[],mail:{subject:"A quick update from {biz}",body:"Hi {name},\n\n[Write your update or offer here.]\n\nThank you,"},updates:[],
 logs:[],bell:{items:[],keys:{}},support:{topic:"I need help with a tool",name:"",msg:""},
 mode:"biz",cover:"",clients:[],activeClient:"",gaps:[],gapIn:{industry:"",market:"Antigua and Barbuda",aud:"",comp:"",pain:"",strength:""},gapOut:null,adIn:{business:"",offer:"",market:"Antigua and Barbuda",platform:"Facebook and Instagram",goal:"Generate leads",budget:"",aud:"",notes:""},adOut:null,camps:[],prospects:[]};
var TITLES={home:"ReBoRn Tools",margin:"Margin and profit",seo:"SEO subtitle maker",tasks:"Workflow reminders",fund:"Funding finder",mail:"Email and page updates",funnel:"Funnel and wins",help:"Support",set:"Settings"};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function n0(x){return Math.round(x).toLocaleString("en-US")}
function num(v){var x=parseFloat(v);return isFinite(x)?x:0}
function pad(n){return n<10?"0"+n:""+n}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function C(){return S.set.cur||""}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},1900)}
function copy(t){var ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();toast(ok?"Copied":"Select the text and copy it")}
function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);Object.keys(d).forEach(function(k){if(d[k]&&typeof d[k]==="object"&&!Array.isArray(d[k])&&S[k]&&typeof S[k]==="object"&&!Array.isArray(S[k]))Object.assign(S[k],d[k]);else S[k]=d[k]})}}catch(e){}}
function save(){try{var o={};Object.keys(S).forEach(function(k){if(k!=="view"&&k!=="bellOpen")o[k]=S[k]});localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
function applyTheme(){var r=document.documentElement;if(S.set.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",S.set.theme)}
function field(id,label,val,type,extra){return '<label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+(type||"text")+'" value="'+esc(val)+'" '+(extra||"")+'>'}
function opts(arr,v){return arr.map(function(a){return '<option '+(a===v?"selected":"")+'>'+esc(a)+'</option>'}).join("")}
function cap(s){return String(s||"").replace(/\w\S*/g,function(w){return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()})}

/* ---------- Home ---------- */
function hexPts(cx,cy,r){var p=[];for(var k=0;k<6;k++){var a=Math.PI/180*(60*k-90);p.push((cx+r*Math.cos(a)).toFixed(1)+","+(cy+r*Math.sin(a)).toFixed(1))}return p.join(" ")}
var TILES=[["margin","%","Margin","Profit calculator",-60],["seo","H2","SEO","Subtitle maker",0],["tasks","\u2713","Workflow","Reminders",60],["fund","$","Funding","Finder",120],["mail","@","Email","Campaigns, updates",180],["help","?","Support","Ask ReBoRn",240]];
function dueCount(){var t=today();return S.tasks.filter(function(x){return !x.done&&x.due&&x.due<=t}).length}
function hexMenu(tiles,center,label){
  var cx=180,cy=190,d=108,svg='<svg viewBox="0 0 360 380" width="100%" style="display:block;max-width:420px;margin:0 auto" role="group" aria-label="'+label+'">';
  tiles.forEach(function(t){
    var x=cx+d*Math.cos(t[4]*Math.PI/180),y=cy+d*Math.sin(t[4]*Math.PI/180);
    var lk=!can(t[0]);svg+='<g class="tile'+(lk?' locked':'')+'" tabindex="0" role="button" aria-label="'+t[2]+', '+t[3]+(lk?', locked, part of the client package':'')+'" data-go="'+t[0]+'"><polygon points="'+hexPts(x,y,58)+'"/><text x="'+x+'" y="'+(y-6)+'" text-anchor="middle" font-size="26" font-weight="700">'+t[1]+'</text><text x="'+x+'" y="'+(y+16)+'" text-anchor="middle" font-size="14" font-weight="600">'+t[2]+'</text><text x="'+x+'" y="'+(y+31)+'" text-anchor="middle" font-size="11" opacity=".8">'+(lk?'\uD83D\uDD12 Client package':t[3])+'</text></g>';
  });
  var clk=!can(center[0]);svg+='<g class="tile center'+(clk?' locked':'')+'" tabindex="0" role="button" aria-label="'+center[2]+', '+center[3]+(clk?', locked, part of the client package':'')+'" data-go="'+center[0]+'"><polygon points="'+hexPts(cx,cy,58)+'"/><text x="'+cx+'" y="'+(cy-6)+'" text-anchor="middle" font-size="22" font-weight="700">'+center[1]+'</text><text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" font-size="14" font-weight="600">'+center[2]+'</text><text x="'+cx+'" y="'+(cy+31)+'" text-anchor="middle" font-size="11" opacity=".85">'+(clk?'\uD83D\uDD12 Client package':center[3])+'</text></g></svg>';
  return svg;
}
function vHome(){
  var biz=EDITION!=="agency"||S.mode!=="agency";
  var seg=EDITION!=="agency"?'':'<div class="row" role="group" aria-label="Choose a toolset" style="margin-bottom:10px"><button class="btn grow '+(biz?"primary":"")+'" data-mode="biz" aria-pressed="'+biz+'">For businesses</button><button class="btn grow '+(!biz?"primary":"")+'" data-mode="agency" aria-pressed="'+!biz+'">For the agency</button></div>';
  var cover=S.cover?'<img src="'+esc(S.cover)+'" alt="Cover image" style="width:100%;max-height:150px;object-fit:cover;border-radius:12px;margin-bottom:10px">':'';
  var due=dueCount(),menu,list,note;
  if(biz){
    menu=hexMenu(TILES,["funnel","\u25BC","Funnel","Track and celebrate"],"Business tools menu");
    list=TILES.map(function(t){return '<button class="btn" data-go="'+t[0]+'">'+t[2]+(can(t[0])?'':' (client package)')+'</button>'}).join("")+'<button class="btn gold" data-go="funnel">Funnel'+(can("funnel")?'':' (client package)')+'</button>';
    note="Free tools to help your business earn more and waste less. Tap a hexagon. Everything you enter stays on this device.";
  } else {
    menu=hexMenu(AGTILES,["clients","C","Clients","Workspace"],"Agency tools menu");
    list=AGTILES.map(function(t){return '<button class="btn" data-go="'+t[0]+'">'+t[2]+'</button>'}).join("")+'<button class="btn gold" data-go="clients">Clients</button>';
    note="Agency tools for research, prospecting and campaign drafts. Save a client first, then tap Use to load it into the other tools.";
  }
  return cover+seg+'<div class="note">'+note+'</div>'+menu+
  (due?'<p class="meta" style="text-align:center"><b>'+due+'</b> reminder'+(due>1?"s":"")+' due. <a href="#" data-go="tasks">Open workflow</a></p>':'')+
  '<div class="grid" style="margin-top:8px">'+list+'</div>'+
  '<p class="meta" style="text-align:center;margin-top:12px">Want ReBoRn to set these up for your business? Open Support.</p>';
}

/* ---------- Margin ---------- */
function mOut(){
  var m=S.margin,gp=m.price-m.cost,gm=m.price>0?gp/m.price:0,mk=m.cost>0?gp/m.cost:0,mg=gp*m.jobs,net=mg-m.fixed,be=gp>0?Math.ceil(m.fixed/gp):null;
  var tp=m.target<100&&m.target>=0?m.cost/(1-m.target/100):null;
  var msg=m.price<=0?"Enter a price to see results.":gm*100>=m.target?"Your margin is at or above your target.":"Your margin is below your target of "+m.target+"%. To reach it, charge about "+C()+n0(tp||0)+" or lower the cost per job.";
  return '<div class="grid"><div class="stat"><b>'+C()+n0(gp)+'</b><span>Profit per job</span></div><div class="stat"><b>'+(gm*100).toFixed(0)+'%</b><span>Margin</span></div><div class="stat"><b>'+(mk*100).toFixed(0)+'%</b><span>Markup on cost</span></div><div class="stat"><b>'+(be==null?"-":be)+'</b><span>Jobs to break even</span></div></div>'+
  '<div class="card"><div class="two"><div><div class="meta">Monthly gross profit</div><b>'+C()+n0(mg)+'</b></div><div><div class="meta">Monthly profit after fixed costs</div><b style="color:'+(net<0?"var(--bad)":"inherit")+'">'+C()+n0(net)+'</b></div></div><p style="margin:10px 0 0">'+esc(msg)+'</p></div>'+
  '<p class="meta">A planning estimate. It leaves out tax and any pay for yourself unless you include them in the costs.</p>';
}
function vMargin(){var m=S.margin;return '<div class="note">Type your numbers. Results update as you type.</div><div class="two">'+field("m_price","Price per job, "+C(),m.price,"number",'data-m="price" inputmode="decimal" min="0"')+field("m_cost","Direct cost per job, "+C(),m.cost,"number",'data-m="cost" inputmode="decimal" min="0"')+'</div><div class="two">'+field("m_jobs","Jobs per month",m.jobs,"number",'data-m="jobs" inputmode="decimal" min="0"')+field("m_fixed","Fixed costs per month, "+C(),m.fixed,"number",'data-m="fixed" inputmode="decimal" min="0"')+'</div>'+field("m_target","Target margin, %",m.target,"number",'data-m="target" inputmode="decimal" min="0" max="99"')+'<div id="mOut" style="margin-top:12px">'+mOut()+'</div>'}

/* ---------- SEO ---------- */
function seoGen(){
  var q=S.seo,svc=(q.svc||"your service").trim(),loc=(q.loc||"your area").trim(),biz=(q.biz||"Your Business").trim(),aud=(q.aud||"homes and businesses").trim(),ben=(q.benefit||"").trim();
  var Svc=cap(svc),T=[];
  T.push("PAGE TITLES (H1 ideas)");T.push("1. "+Svc+" in "+cap(loc));T.push("2. Trusted "+svc+" for "+aud+" in "+loc);T.push("3. "+biz+": "+svc+(ben?" that "+ben:" done right"));T.push("");
  T.push("SUBTITLES (H2 ideas)");
  ["Our "+svc+" services","Areas we serve around "+loc,"Why customers choose "+biz,"How it works in three simple steps","Prices and how to get a quote","Recent work and customer stories","Questions about "+svc+", answered","Contact "+biz+" today"].forEach(function(x,i){T.push((i+1)+". "+x)});T.push("");
  T.push("FAQ HEADINGS");
  ["How much does "+svc+" cost in "+loc+"?","How long does "+svc+" take?","Do you serve "+loc+" and nearby areas?","How do I book or request a quote?","What should I prepare before you arrive?"].forEach(function(x,i){T.push((i+1)+". "+x)});T.push("");
  var mt=(Svc+" in "+cap(loc)+" | "+biz);if(mt.length>60)mt=mt.slice(0,57)+"...";
  var md=biz+" offers "+svc+" in "+loc+(ben?" that "+ben:"")+". Call, message on WhatsApp or request a quote today.";if(md.length>155)md=md.slice(0,152)+"...";
  T.push("META TITLE ("+mt.length+" of 60 characters)");T.push(mt);T.push("");
  T.push("META DESCRIPTION ("+md.length+" of 155 characters)");T.push(md);T.push("");
  T.push("IMAGE ALT TEXT IDEAS");T.push("- "+svc+" work by "+biz+" in "+loc);T.push("- Before and after "+svc+" in "+loc);T.push("- The "+biz+" team at work");T.push("");
  T.push("Tips: keep one H1 per page, use headings that read naturally, and only claim what you can show. No tool can promise a ranking.");
  return T.join("\n");
}
function vSeo(){var q=S.seo;return '<div class="note">Fills proven heading patterns from your answers. It is a template, not an AI service, so adjust the wording to sound like you.</div>'+
 field("s_svc","Service, for example window cleaning",q.svc,"text",'data-s="svc"')+'<div class="two">'+field("s_biz","Business name",q.biz,"text",'data-s="biz"')+field("s_loc","Town or island",q.loc,"text",'data-s="loc"')+'</div>'+
 field("s_aud","Who are your customers?",q.aud,"text",'data-s="aud" placeholder="villa owners, hotels, families"')+field("s_ben","One benefit, optional",q.benefit,"text",'data-s="benefit" placeholder="is fast, tidy and fairly priced"')+
 '<div class="row" style="margin-top:12px"><button class="btn primary grow" data-act="seo">Make my subtitles</button></div>'+
 (S.seoOut?'<div class="out" style="margin-top:10px">'+esc(S.seoOut)+'</div><div class="row" style="margin-top:8px"><button class="btn" data-act="seoCopy">Copy all</button></div>':'')}

/* ---------- Workflow ---------- */
var TASKT=[["Follow up on open quotes","weekly"],["Post an update or offer","weekly"],["Ask recent customers for a review","monthly"],["Check margins and prices","monthly"],["Back up customer list","monthly"]];
function nextDue(d,rep){var x=new Date(d+"T00:00:00");if(rep==="daily")x.setDate(x.getDate()+1);else if(rep==="weekly")x.setDate(x.getDate()+7);else if(rep==="monthly")x.setMonth(x.getMonth()+1);return x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate())}
function vTasks(){
  var t=today(),list=S.tasks.slice().sort(function(a,b){return (a.done-b.done)||String(a.due).localeCompare(String(b.due))});
  var rows=list.length?list.map(function(x){var over=!x.done&&x.due&&x.due<=t;
    return '<div class="li"><label class="check" style="margin:0;font-size:15px;color:inherit;font-weight:400"><input type="checkbox" data-done="'+x.id+'" '+(x.done?"checked":"")+' aria-label="Mark done"><span style="'+(x.done?"text-decoration:line-through;opacity:.6":"")+'">'+esc(x.title)+'<br><span class="meta">'+(x.due?"Due "+esc(x.due):"No date")+(x.rep&&x.rep!=="none"?", repeats "+x.rep:"")+'</span></span></label><span>'+(over?'<span class="chip bad">Due</span> ':"")+'<button class="btn small" data-deltask="'+x.id+'" aria-label="Delete task">Delete</button></span></div>'}).join(""):'<p class="meta">No reminders yet. Add one, or tap a suggestion.</p>';
  var supports=("Notification" in window);
  return '<div class="note">Reminders show here and can pop up as notifications while this page is open. A web page cannot wake your phone when it is closed, so check back daily or add key dates to your phone calendar too.</div>'+
  field("t_title","Reminder","","text",'placeholder="Call Mr. Smith about the quote"')+'<div class="two">'+field("t_due","Due date",today(),"date")+'<div><label for="t_rep">Repeat</label><select id="t_rep"><option value="none">Does not repeat</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select></div></div>'+
  '<div class="row" style="margin-top:10px"><button class="btn primary grow" data-act="addTask">Add reminder</button></div>'+
  '<p class="meta" style="margin:12px 0 4px">Quick adds</p><div class="row">'+TASKT.map(function(x,i){return '<button class="btn small" data-tpl="'+i+'">'+esc(x[0])+'</button>'}).join("")+'</div>'+
  '<div class="card">'+rows+'</div>'+
  (supports?'<label class="check" style="font-size:14px;color:inherit;font-weight:400"><input type="checkbox" id="notifyOn" '+(S.notifyOn?"checked":"")+'><span>Show notifications for due reminders</span></label>':'<p class="meta">This browser does not support notifications.</p>');
}
function checkDue(){
  if(!S.notifyOn||!("Notification" in window)||Notification.permission!=="granted")return;
  var t=today(),ch=false;
  S.tasks.forEach(function(x){if(!x.done&&x.due&&x.due<=t&&x.n!==t){try{new Notification("Reminder",{body:x.title})}catch(e){}x.n=t;ch=true}});
  if(ch)save();
}

/* ---------- Funding ---------- */
function fundGen(){
  var f=S.fund,out=[],big=f.amount.indexOf("Large")===0,small=f.amount.indexOf("Small")===0,est=f.stage.indexOf("1 year")>-1,idea=f.stage.indexOf("Idea")===0,reg=f.reg==="Yes";
  out.push("FUNDING TYPES WORTH EXPLORING FOR: "+f.purpose.toUpperCase());out.push("");
  if(!reg)out.push("First step: register or formalise the business. Most grants, loans and sponsors ask for it.\n");
  if(idea||!est)out.push("- Customer pre-payments or deposits: ask early customers to pay part up front. It costs nothing and proves demand.");
  if(small)out.push("- Microloans and community or credit-union loans: usually quicker for small amounts. Compare the total cost, not just the monthly payment.");
  if(est&&!small)out.push("- Bank or credit-union business loan: lenders look for 12 months or more of income records.");
  if(f.purpose==="Equipment"||f.purpose==="Vehicle")out.push("- Equipment financing or supplier credit: the item itself often secures the deal. Ask suppliers for payment terms.");
  if(f.purpose==="Working capital")out.push("- Short-term working capital or a credit line, plus tighter invoicing: shorten the time you wait to be paid.");
  if(f.purpose==="Marketing")out.push("- Small business support programs and chamber of commerce schemes: some cover marketing or training costs. Check each one.");
  if(f.purpose==="Community project or event")out.push("- Sponsors and community fundraising: package benefits for sponsors and set a clear goal and date.\n- Grants from foundations, development agencies and government programs: look for ones that match your cause.");
  else out.push("- Grants and business-support programs from government, regional development bodies and NGOs: free money if you qualify, but check eligibility and deadlines.");
  if(big&&est)out.push("- Investors or business partners: for larger growth plans. Be ready with a one-page plan and clear numbers.");
  if(big&&!est)out.push("- Larger amounts are hard for a new business. Consider starting smaller, building a track record, then raising more.");
  out.push("");out.push("PREPARE THESE FIRST");
  ["Business registration or ID","Simple 12-month income and cost summary","A quote for what you plan to buy","A one-page plan: what you do, who pays you, how the money will be used","Your contact details and bank details kept private until a trusted provider asks"].forEach(function(x){out.push("- "+x)});
  out.push("");out.push("Check each provider yourself. This is general information, not financial advice, and no specific program or approval is promised. Never pay an upfront fee to \"unlock\" funding.");
  return out.join("\n");
}
function vFund(){

function funnelSvg(t){
  var st=[["Visitors",t.v,"#1d3a69"],["Leads",t.l,"#2a78d6"],["Quotes",t.q,"#d4a62a"],["Sales",t.s,"#1f7a6c"]],base=t.v>0?t.v:(t.l>0?t.l:0);

  st.forEach(function(x,i){
    var n=base?Math.max(x[1]>0?1:0,Math.round(x[1]/base*10)):0;if(i===0&&t.v===0)n=0;if(i===0&&x[1]>0)n=10;

}

document.addEventListener("input",function(e){
  var t=e.target,d=t.dataset;
  if(d.m){S.margin[d.m]=num(t.value);save();document.getElementById("mOut").innerHTML=mOut();return}
  if(d.s){S.seo[d.s]=t.value;save();return}
  if(d.f)return;
  if(d.e){S.mail[d.e]=t.value;save();return}
  if(d.h){S.support[d.h]=t.value;save();var a=document.getElementById("waBtn");if(a)a.href=waLink();return}
  if(d.set){S.set[d.set]=t.value;save();return}
});
document.addEventListener("change",function(e){
  var t=e.target,d=t.dataset;
  if(d.f){S.fund[d.f]=t.value;save();return}
  if(d.h){S.support[d.h]=t.value;save();var a=document.getElementById("waBtn");if(a)a.href=waLink();return}
  if(t.id==="notifyOn"){if(t.checked){if(!("Notification" in window))return;Notification.requestPermission().then(function(p){S.notifyOn=p==="granted";if(p!=="granted")toast("Notifications were not allowed");save();render()})}else{S.notifyOn=false;save()}return}
  if(t.id==="st_sound"){S.set.sound=t.checked;save();if(t.checked)ding();return}
});
document.addEventListener("click",function(e){if(S.bellOpen&&!e.target.closest("#bellPanel")&&!e.target.closest("#bellBtn")){S.bellOpen=false;chrome()}},true);

document.getElementById("logo").src=document.querySelector('link[rel="apple-touch-icon"]').href;
load();applyTheme();render();checkDue();setInterval(checkDue,60000);
</script>
</body>
</html>
